        <section class="video-section">
            <div class="container">

                <div class="video-wrapper">
                    <iframe
                        class="video"
                        src="https://www.youtube.com/embed/y2Iosk1jjkE"
                        title="Vow[el]s YouTube video"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"

                    </iframe>
                </div>
            </div>
        </section>

        <section class="contact-section">
            <div class="container">
                <h2 class="section-title">Contact</h2>

                <form action="https://formsubmit.co/encryptedemail80@gmail.com" method="POST" class="contact-form">
                    <input type="hidden" name="_captcha" value="false">

                    <!-- Update this when hosted live -->
                    <!-- <input type="hidden" name="_next" value="https://yourdomain.com/thanks.html"> -->

                    <input type="text" name="name" class="form-control" placeholder="Name" required>
                    <input type="email" name="email" class="form-control" placeholder="Email Address" required>
                    <textarea name="message" class="message" rows="8" placeholder="Your Message" required></textarea>

                    <button type="submit" class="submit">Send</button>
                </form>
            </div>
        </section>
